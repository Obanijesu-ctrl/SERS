{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Log in</h1>
    <p class="muted">Route power. Not paperwork.</p>
    <form method="POST">
      <label>Username
        <input type="text" name="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="muted small">Demo login: <code>admin</code> / <code>admin123</code></p>
    <p class="small">No account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  </div>
</div>
{% endblock %}
